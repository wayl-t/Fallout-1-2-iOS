name: Build Fallout Launcher IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - launcher/**
      - .github/workflows/build-launcher.yml
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Clone fallout1-ce
        run: git clone --depth 1 https://github.com/alexbatalov/fallout1-ce.git work/fallout1-ce
      - name: Clone fallout2-ce
        run: git clone --depth 1 https://github.com/alexbatalov/fallout2-ce.git work/fallout2-ce
      - name: Configure launcher (iOS)
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=RelWithDebInfo -D CMAKE_TOOLCHAIN_FILE=work/fallout1-ce/cmake/toolchain/ios.toolchain.cmake -D ENABLE_BITCODE=0 -D PLATFORM=OS64 -G Xcode -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' -D CMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build launcher
        run: cmake --build build --config RelWithDebInfo -j $(sysctl -n hw.physicalcpu)
      - name: Pack IPA
        run: cd build && cpack -C RelWithDebInfo
      - name: Inspect IPA
        run: |
          ls -lh build/*.ipa
          unzip -l build/fallout-launcher.ipa | head -n 40
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: fallout-launcher-ipa
          path: build/fallout-launcher.ipa
          retention-days: 7
