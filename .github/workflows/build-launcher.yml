name: Build Fallout Launcher IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - launcher/**
      - patches/**
      - .github/workflows/build-launcher.yml
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Clone fallout1-ce
        run: git clone --depth 1 https://github.com/alexbatalov/fallout1-ce.git work/fallout1-ce
      - name: Clone fallout2-ce
        run: git clone --depth 1 https://github.com/alexbatalov/fallout2-ce.git work/fallout2-ce
      - name: Patch touch handling in both engines
        run: python patches/fix_touch.py
      - name: Add touch logging to both engines
        run: python patches/add_logging.py
      - name: Fix menu buttons for touch
        run: python patches/fix_menu_buttons.py
      - name: Add engine logging for fonts and databases
        run: python patches/add_engine_logging.py
      - name: 'Fix controls: debug log, buttons, camera stick'
        run: python patches/fix_controls.py
      - name: Add crash logging
        run: python patches/add_crash_log.py
      - name: Add crash backtrace
        run: python patches/add_crash_backtrace.py
      - name: Fix combat crash guards
        run: python patches/fix_combat_crash.py
      - name: Add side buttons in letterbox bars
        run: python patches/add_side_buttons.py
      - name: Update side buttons v2
        run: python patches/update_side_buttons_v2.py
      - name: Fix side button type include
        run: python patches/fix_side_include.py
      - name: Update side buttons v3 texture and persistent labels
        run: python patches/update_side_buttons_v3.py
      - name: Fix side texture placement
        run: python patches/fix_side_texture.py
      - name: Update side buttons v4 Russian labels
        run: python patches/update_side_buttons_v4.py
      - name: Update side buttons v5 readable font and menu labels
        run: python patches/update_side_buttons_v5.py
      - name: Configure launcher (iOS)
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=RelWithDebInfo -D CMAKE_TOOLCHAIN_FILE=work/fallout1-ce/cmake/toolchain/ios.toolchain.cmake -D ENABLE_BITCODE=0 -D PLATFORM=OS64 -G Xcode -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' -D CMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build launcher
        run: cmake --build build --config RelWithDebInfo -j $(sysctl -n hw.physicalcpu)
      - name: Pack IPA
        run: cd build && cpack -C RelWithDebInfo
      - name: Inspect IPA
        run: |
          ls -lh build/*.ipa
          unzip -l build/fallout-launcher.ipa | head -n 40
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: fallout-launcher-ipa
          path: build/fallout-launcher.ipa
          retention-days: 7
