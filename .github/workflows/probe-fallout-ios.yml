name: Probe Fallout iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/probe-fallout-ios.yml]
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Clone fallout1-ce
        run: git clone --depth 1 https://github.com/alexbatalov/fallout1-ce.git fallout1-ce
      - name: Clone fallout2-ce
        run: git clone --depth 1 https://github.com/alexbatalov/fallout2-ce.git fallout2-ce
      - name: Build Fallout 1
        working-directory: fallout1-ce
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=RelWithDebInfo -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake -D ENABLE_BITCODE=0 -D PLATFORM=OS64 -G Xcode -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' -D CMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config RelWithDebInfo -j $(sysctl -n hw.physicalcpu)
          cd build && cpack -C RelWithDebInfo
      - name: Build Fallout 2
        working-directory: fallout2-ce
        run: |
          cmake --preset ios -D CMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build --preset ios-release
          cd out/build/ios && cpack -C RelWithDebInfo
      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-ipas
          path: |
            fallout1-ce/build/fallout-ce.ipa
            fallout2-ce/out/build/ios/fallout2-ce.ipa
          retention-days: 7

